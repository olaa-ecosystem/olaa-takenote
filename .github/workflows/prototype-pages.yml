# Tests the iPad and iPhone prototypes and publishes both to GitHub Pages so they can be installed from Safari
# (Add to Home Screen). The site root sends iPhones to iphone-home/ and everything else to ipad-home/.
# One-time setup by a repository admin: Settings → Pages → Source: GitHub Actions.
name: Prototype (test and publish)

on:
  push:
    branches: [main]
    paths: ['prototypes/**', '.github/workflows/prototype-pages.yml']
  pull_request:
    paths: ['prototypes/**', '.github/workflows/prototype-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes
    steps:
      - uses: actions/checkout@v4
      # The device folders must match source/. On main that is strict. On a pull request a stale build is rebuilt here
      # and tested anyway: prototype-sync.yml commits the rebuild to the branch, but a bot push (GITHUB_TOKEN) never
      # starts a new pull-request run, so failing here would leave the check red after the sync has fixed it.
      - name: Check the device builds are current
        run: |
          if python3 tools/build.py --check; then exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::The iPad/iPhone builds were out of date; testing a fresh build. prototype-sync.yml commits it to the branch."
            python3 tools/build.py
          else
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --trace off

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # publish only the apps' own files: no source, tests, tooling or docs
      - name: Collect site
        run: |
          mkdir -p _site/ipad-home _site/iphone-home
          cd prototypes
          cp -r shared ../_site/
          (cd ipad-home && cp -r index.html manifest.webmanifest sw.js css js ../../_site/ipad-home/)
          (cd iphone-home && cp -r index.html manifest.webmanifest sw.js css js ../../_site/iphone-home/)
          cat > ../_site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Olaa Notes</title><meta name="referrer" content="no-referrer">
          <p>Opening Olaa Notes… <a href="ipad-home/">iPad</a> · <a href="iphone-home/">iPhone</a></p>
          <script src="pick.js"></script>
          EOF
          echo "location.replace(/iPhone|iPod/.test(navigator.userAgent) || Math.min(screen.width, screen.height) < 600 ? 'iphone-home/' : 'ipad-home/');" > ../_site/pick.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
